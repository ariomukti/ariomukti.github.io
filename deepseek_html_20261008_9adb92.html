<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigestiQuest — Asesmen Sistem Pencernaan</title>
<style>
  /* ============ PALET SUNSET ============ */
  :root{
    --sun-deep:#7a2e2e;
    --sun-crimson:#c0392b;
    --sun-orange:#e67e22;
    --sun-amber:#f39c12;
    --sun-gold:#f1c40f;
    --sun-peach:#ffb88c;
    --sun-cream:#fff4e6;
    --sun-dusk:#4a2c2a;
    --sun-purple:#6c3483;
    --sun-plum:#4a235a;
    --text-dark:#3b1f1a;
    --shadow:0 8px 24px rgba(122,46,46,.25);
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}

  body{
    background:linear-gradient(160deg,var(--sun-deep) 0%,var(--sun-crimson) 25%,var(--sun-orange) 50%,var(--sun-amber) 75%,var(--sun-gold) 100%);
    min-height:100vh;
    color:var(--text-dark);
    padding:24px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  /* efek matahari terbenam */
  body::before{
    content:"";
    position:fixed;
    bottom:-150px;left:50%;
    transform:translateX(-50%);
    width:600px;height:600px;
    background:radial-gradient(circle,rgba(255,184,140,.55) 0%,transparent 70%);
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }

  .container{max-width:920px;margin:0 auto;position:relative;z-index:1;}

  /* ============ HEADER ============ */
  header{
    text-align:center;
    color:var(--sun-cream);
    margin-bottom:28px;
    text-shadow:0 3px 12px rgba(0,0,0,.4);
  }
  header h1{
    font-size:2.6rem;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--sun-gold),var(--sun-peach),var(--sun-gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  header p{font-size:1rem;opacity:.95;margin-top:6px;}

  /* ============ PROGRESS ============ */
  .progress-wrap{
    background:rgba(255,244,230,.25);
    backdrop-filter:blur(8px);
    border-radius:16px;
    padding:14px 20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,244,230,.4);
  }
  .progress-info{
    display:flex;justify-content:space-between;
    color:var(--sun-cream);font-weight:600;font-size:.9rem;
    margin-bottom:8px;
  }
  .progress-bar{
    height:10px;background:rgba(74,44,42,.35);
    border-radius:8px;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--sun-gold),var(--sun-peach));
    border-radius:8px;
    transition:width .5s ease;
  }

  /* ============ KARTU SOAL ============ */
  .card{
    background:linear-gradient(145deg,var(--sun-cream),#ffe9d0);
    border-radius:22px;
    padding:28px 30px;
    box-shadow:var(--shadow);
    border:1px solid rgba(230,126,34,.3);
    display:none;
    animation:fadeIn .5s ease;
  }
  .card.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  .q-badge{
    display:inline-block;
    background:linear-gradient(135deg,var(--sun-crimson),var(--sun-orange));
    color:var(--sun-cream);
    font-weight:700;
    padding:5px 16px;
    border-radius:30px;
    font-size:.8rem;
    letter-spacing:1px;
    margin-bottom:14px;
    box-shadow:0 4px 12px rgba(192,57,43,.35);
  }
  .q-badge.hots{
    background:linear-gradient(135deg,var(--sun-purple),var(--sun-plum));
    margin-left:8px;
  }

  .story{
    background:rgba(255,184,140,.35);
    border-left:5px solid var(--sun-orange);
    padding:14px 18px;
    border-radius:10px;
    font-style:italic;
    font-size:.95rem;
    margin-bottom:18px;
    line-height:1.55;
  }

  .question{
    font-size:1.15rem;
    font-weight:700;
    line-height:1.5;
    margin-bottom:16px;
    color:var(--sun-dusk);
  }

  .context-img{
    width:100%;
    max-height:260px;
    object-fit:contain;
    border-radius:14px;
    margin:12px 0 18px;
    border:3px solid var(--sun-peach);
    background:#fff;
  }

  /* ============ OPSI JAWABAN ============ */
  .options{display:flex;flex-direction:column;gap:11px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    background:#fff;
    padding:14px 18px;
    border-radius:14px;
    border:2px solid rgba(230,126,34,.25);
    cursor:pointer;
    transition:all .25s;
    font-size:.98rem;
    line-height:1.45;
  }
  .option:hover{
    border-color:var(--sun-orange);
    transform:translateX(5px);
    box-shadow:0 4px 14px rgba(230,126,34,.25);
  }
  .option input{display:none;}
  .option .marker{
    min-width:30px;height:30px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--sun-amber),var(--sun-orange));
    color:#fff;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;
  }
  .option.selected{
    background:linear-gradient(135deg,var(--sun-peach),#ffd9b3);
    border-color:var(--sun-crimson);
    box-shadow:0 4px 16px rgba(192,57,43,.3);
  }
  .option.selected .marker{
    background:linear-gradient(135deg,var(--sun-crimson),var(--sun-deep));
  }

  /* ============ TEXTAREA & CANVAS ============ */
  textarea{
    width:100%;
    min-height:110px;
    padding:14px;
    border-radius:14px;
    border:2px solid rgba(230,126,34,.35);
    font-size:.95rem;
    font-family:inherit;
    resize:vertical;
    background:#fff;
    color:var(--text-dark);
    line-height:1.5;
  }
  textarea:focus{outline:none;border-color:var(--sun-crimson);box-shadow:0 0 0 4px rgba(192,57,43,.12);}

  .canvas-wrap{
    background:#fff;
    border-radius:14px;
    padding:12px;
    border:2px dashed var(--sun-orange);
    text-align:center;
  }
  canvas{
    border-radius:10px;
    cursor:crosshair;
    background:#fffef9;
    touch-action:none;
    max-width:100%;
  }
  .draw-tools{
    display:flex;gap:10px;flex-wrap:wrap;
    margin-top:12px;justify-content:center;align-items:center;
  }
  .draw-tools button{
    background:linear-gradient(135deg,var(--sun-amber),var(--sun-orange));
    color:#fff;border:none;
    padding:8px 16px;border-radius:10px;
    font-weight:600;cursor:pointer;font-size:.85rem;
    transition:.2s;
  }
  .draw-tools button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(230,126,34,.4);}
  .draw-tools input[type=color]{
    width:38px;height:38px;border:none;border-radius:8px;cursor:pointer;background:none;
  }
  .draw-tools input[type=range]{width:100px;accent-color:var(--sun-crimson);}

  /* ============ TOMBOL NAVIGASI ============ */
  .nav{
    display:flex;justify-content:space-between;gap:14px;
    margin-top:24px;flex-wrap:wrap;
  }
  .btn{
    padding:13px 30px;
    border:none;border-radius:14px;
    font-size:1rem;font-weight:700;
    cursor:pointer;transition:.25s;
    letter-spacing:.4px;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--sun-crimson),var(--sun-deep));
    color:var(--sun-cream);
    box-shadow:0 6px 18px rgba(122,46,46,.4);
  }
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(122,46,46,.5);}
  .btn-secondary{
    background:linear-gradient(135deg,var(--sun-gold),var(--sun-amber));
    color:var(--sun-dusk);
    box-shadow:0 6px 18px rgba(243,156,18,.4);
  }
  .btn-secondary:hover{transform:translateY(-3px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}

  /* ============ HASIL ============ */
  .result{text-align:center;padding:20px 0;}
  .result .score-circle{
    width:170px;height:170px;margin:0 auto 22px;
    border-radius:50%;
    background:conic-gradient(var(--sun-crimson) var(--deg,0deg),rgba(230,126,34,.2) 0deg);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .result .score-circle::before{
    content:"";position:absolute;inset:14px;
    background:var(--sun-cream);border-radius:50%;
  }
  .result .score-val{
    position:relative;font-size:2.6rem;font-weight:800;color:var(--sun-crimson);
  }
  .result h2{color:var(--sun-dusk);margin-bottom:10px;font-size:1.7rem;}
  .result .predikat{
    display:inline-block;padding:8px 26px;border-radius:30px;
    font-weight:700;margin-bottom:22px;color:#fff;
  }
  .review{
    text-align:left;background:#fff;border-radius:16px;
    padding:20px;margin-top:20px;
    max-height:340px;overflow-y:auto;
    border:2px solid rgba(230,126,34,.25);
  }
  .review-item{
    padding:12px;border-bottom:1px dashed rgba(230,126,34,.35);
    font-size:.9rem;line-height:1.5;
  }
  .review-item:last-child{border:none;}
  .review-item b{color:var(--sun-crimson);}
  .review-item .correct{color:#1e8449;font-weight:700;}
  .review-item .wrong{color:#c0392b;font-weight:700;}
  .review-item .pembahasan{
    background:rgba(255,184,140,.3);
    padding:8px 12px;border-radius:8px;margin-top:6px;
    font-style:italic;font-size:.85rem;color:var(--sun-dusk);
  }

  /* ============ INTRO ============ */
  .intro{text-align:center;}
  .intro .emoji{font-size:4rem;margin-bottom:10px;}
  .intro h2{color:var(--sun-dusk);margin-bottom:14px;}
  .intro p{line-height:1.7;margin-bottom:14px;font-size:.98rem;}
  .intro ul{text-align:left;display:inline-block;margin:14px auto;line-height:1.9;font-size:.95rem;}
  .intro ul li{list-style:none;}
  .intro ul li::before{content:"🌇 ";}
  .name-input{
    width:100%;max-width:360px;
    padding:13px 18px;border-radius:12px;
    border:2px solid rgba(230,126,34,.4);
    font-size:1rem;margin:16px auto;display:block;text-align:center;
  }

  @media(max-width:600px){
    header h1{font-size:1.9rem;}
    .card{padding:20px 18px;}
    .btn{padding:11px 20px;font-size:.9rem;}
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🌅 DigestiQuest</h1>
    <p>Asesmen Kontekstual Sistem Pencernaan Manusia — Kelas XI</p>
  </header>

  <div class="progress-wrap" id="progressWrap" style="display:none;">
    <div class="progress-info">
      <span id="progText">Soal 1 dari 15</span>
      <span id="progPersen">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
  </div>

  <div id="app"></div>
</div>

<script>
/* =========================================================
   DATA SOAL — 15 soal berjembatan logika (narrative: Rani)
   Aspek HOTS: C4 analisis, C5 evaluasi, C6 mencipta
   ========================================================= */
const QUESTIONS = [
  /* ---------- SOAL 1 ---------- */
  {
    type:"mc",
    hots:"C4 — Analisis",
    story:"Pukul 06.30, Rani sarapan nasi goreng dengan telur dan segelas susu. Dua jam kemudian di sekolah, ia mulai merasa lapar lagi meskipun porsi sarapannya cukup banyak.",
    q:"Berdasarkan konsep pencernaan kimiawi, mengapa Rani lebih cepat merasa lapar dibandingkan jika ia mengonsumsi nasi dengan lauk berserat tinggi (sayur dan kacang)?",
    options:[
      "Karena susu mempercepat pengosongan lambung sehingga makanan cepat habis",
      "Karena protein dan lemak dicerna lebih lambat, sementara karbohidrat sederhana meninggalkan lambung lebih cepat dan tidak memberi rasa kenyang lama",
      "Karena enzim amilase hanya bekerja di mulut sehingga nasi tidak dicerna di lambung",
      "Karena telur menghambat kerja enzim pepsin di lambung",
      "Karena serat mempercepat pengosongan lambung"
    ],
    answer:1,
    pembahasan:"Karbohidrat sederhana (nasi putih) meninggalkan lambung cepat, sedangkan protein (telur) dan lemak serta serat (sayur, kacang) memperlambat pengosongan lambung sehingga rasa kenyang bertahan lebih lama. Ini analisis hubungan jenis nutrien dengan durasi kenyang."
  },
  /* ---------- SOAL 2 ---------- */
  {
    type:"mc",
    hots:"C4 — Analisis (dengan gambar)",
    story:"Saat mengunyah nasi, Rani merasakan rasa manis muncul perlahan. Ia kemudian mengunyah sepotong apel dan merasakan hal serupa.",
    q:"Perhatikan gambar organ pencernaan berikut. Enzim yang berperan mengubah amilum menjadi maltosa pada bagian yang ditunjuk anak panah (rongga mulut) adalah …",
    img:"organ_pencernaan",
    options:[
      "Pepsin, bekerja optimal pada pH 2",
      "Amilase (ptialin), bekerja optimal pada pH netral (7)",
      "Tripsin, diaktifkan oleh enterokinase",
      "Lipase, mengubah lemak menjadi asam lemak",
      "Renin, mengendapkan protein kasein"
    ],
    answer:1,
    pembahasan:"Di rongga mulut, kelenjar ludah menghasilkan enzim amilase (ptialin) yang mengubah amilum → maltosa pada pH netral. Rasa manis yang muncul adalah indikasi kerja enzim ini."
  },
  /* ---------- SOAL 3 ---------- */
  {
    type:"mc",
    hots:"C5 — Evaluasi",
    story:"Rani kemudian menelan makanan. Makanan melewati kerongkongan menuju lambung. Di lambung, makanan diaduk dan dicampur getah lambung.",
    q:"Seorang siswa menyimpulkan: 'Lambung mencerna semua jenis makanan secara kimiawi dengan enzim yang sama.' Evaluasilah pernyataan tersebut!",
    options:[
      "Benar, karena lambung menghasilkan semua enzim pencernaan",
      "Salah, karena lambung hanya menghasilkan pepsin (protein) dan renin (kasein), sedangkan karbohidrat & lemak tidak dicerna di lambung",
      "Benar, karena HCl mampu memecah semua nutrien",
      "Salah, karena lambung hanya menyerap air",
      "Benar, karena getah lambung mengandung amilase, pepsin, dan lipase sekaligus"
    ],
    answer:1,
    pembahasan:"Getah lambung mengandung HCl, pepsin (protein→pepton), dan renin (kasein). Karbohidrat tidak dicerna di lambung (amilase sudah nonaktif di pH asam) dan lemak baru dicerna di usus halus."
  },
  /* ---------- SOAL 4 ---------- */
  {
    type:"mc",
    hots:"C4 — Analisis (dengan gambar)",
    story:"Makanan yang telah menjadi kim (bubur) masuk ke usus halus. Rani belajar bahwa di usus halus terjadi pencernaan dan penyerapan.",
    q:"Perhatikan gambar penampang usus halus berikut. Bagian yang ditunjuk berfungsi untuk …",
    img:"vili_usus",
    options:[
      "Menghasilkan HCl untuk membunuh bakteri",
      "Memperluas permukaan penyerapan nutrien (vili/jonjot)",
      "Menghasilkan empedu untuk mengemulsi lemak",
      "Mengendapkan protein susu",
      "Menyimpan vitamin A dan D"
    ],
    answer:1,
    pembahasan:"Vili (jonjot usus) adalah lipatan dinding usus halus yang memperluas permukaan penyerapan. Di dalamnya terdapat kapiler darah dan pembuluh limfa (lakteal) untuk mengangkut nutrien."
  },
  /* ---------- SOAL 5 ---------- */
  {
    type:"mc",
    hots:"C5 — Evaluasi",
    story:"Rani membaca label: 'Lemak dalam makanan tidak larut air.' Ia penasaran bagaimana lemak bisa dicerna di usus halus yang lingkungannya berair.",
    q:"Manakah strategi tubuh yang paling tepat dievaluasi untuk mengatasi masalah tersebut?",
    options:[
      "Lemak langsung diserap tanpa dicerna",
      "Empedu dari hati mengemulsi lemak menjadi droplet kecil, lalu lipase pankreas menghidrolisisnya menjadi asam lemak dan gliserol",
      "HCl dari lambung melarutkan lemak",
      "Pepsin memecah lemak menjadi asam amino",
      "Amilase mengubah lemak menjadi glukosa"
    ],
    answer:1,
    pembahasan:"Empedu (bukan enzim) mengemulsi lemak → droplet kecil → memperluas permukaan untuk kerja lipase pankreas. Ini strategi biologis mengatasi ketidaklarutan lemak."
  },
  /* ---------- SOAL 6 ---------- */
  {
    type:"mc",
    hots:"C4 — Analisis",
    story:"Setelah makan, Rani merasa mual dan pusing. Dokter mendiagnosis gangguan pada organ yang menghasilkan empedu. Organ tersebut juga berperan dalam detoksifikasi.",
    q:"Organ yang dimaksud dan fungsi utamanya dalam pencernaan adalah …",
    options:[
      "Pankreas — menghasilkan tripsin",
      "Hati — menghasilkan empedu untuk mengemulsi lemak",
      "Kantung empedu — menghasilkan lipase",
      "Lambung — menghasilkan HCl",
      "Usus halus — menghasilkan enterokinase"
    ],
    answer:1,
    pembahasan:"Hati menghasilkan empedu (disimpan di kantung empedu) yang berfungsi mengemulsi lemak. Hati juga berperan detoksifikasi, sintesis protein plasma, dan penyimpanan glikogen."
  },
  /* ---------- SOAL 7 ---------- */
  {
    type:"mc",
    hots:"C5 — Evaluasi (tabel enzim)",
    story:"Rani membuat tabel perbandingan enzim pencernaan untuk tugasnya.",
    q:"Perhatikan tabel enzim berikut. Pasangan enzim–substrat–hasil yang PALING TEPAT adalah …",
    table:{
      headers:["Enzim","Substrat","Hasil","Organ"],
      rows:[
        ["Pepsin","Protein","Pepton","Lambung"],
        ["Amilase","Lemak","Glukosa","Mulut"],
        ["Lipase","Protein","Asam amino","Usus"],
        ["Tripsin","Amilum","Maltosa","Pankreas"],
        ["Renin","Lemak","Gliserol","Lambung"]
      ]
    },
    options:[
      "Baris 1 (Pepsin)",
      "Baris 2 (Amilase)",
      "Baris 3 (Lipase)",
      "Baris 4 (Tripsin)",
      "Baris 5 (Renin)"
    ],
    answer:0,
    pembahasan:"Hanya baris 1 yang benar: Pepsin (lambung) mengubah protein → pepton. Baris lain salah substrat/hasil/organnya. Ini menguji kemampuan evaluasi tabel."
  },
  /* ---------- SOAL 8 ---------- */
  {
    type:"draw",
    hots:"C6 — Mencipta (Menggambar)",
    story:"Rani ingin membuat catatan visual agar lebih mudah memahami alur pencernaan.",
    q:"Gambarlah sketsa sederhana sistem pencernaan manusia (mulut → kerongkongan → lambung → usus halus → usus besar → anus). Beri label pada minimal 5 organ dan tandai dengan warna berbeda untuk: (1) organ pencernaan mekanik, (2) organ pencernaan kimiawi. Gunakan alat gambar di bawah!",
    pembahasan:"Penilaian: kelengkapan organ (5+), ketepatan label, pembedaan warna mekanik vs kimiawi, kerapian. Mekanik: mulut (gigi), kerongkongan (peristaltik), lambung (pengadukan). Kimiawi: mulut (amilase), lambung (pepsin), usus halus (enzim pankreas & usus)."
  },
  /* ---------- SOAL 9 ---------- */
  {
    type:"mc",
    hots:"C4 — Analisis",
    story:"Setelah melalui usus halus, sisa makanan masuk ke usus besar. Rani memperhatikan bahwa di usus besar terjadi penyerapan air dan pembusukan oleh bakteri Escherichia coli.",
    q:"Jika seseorang mengalami diare, organ manakah yang terganggu fungsi penyerapannya dan apa dampaknya?",
    options:[
      "Lambung — produksi HCl berlebih",
      "Usus besar — penyerapan air terganggu sehingga feses cair",
      "Usus halus — penyerapan glukosa berhenti",
      "Hati — empedu tidak diproduksi",
      "Pankreas — enzim tidak disekresikan"
    ],
    answer:1,
    pembahasan:"Diare terjadi karena usus besar tidak mampu menyerap air dengan baik, sehingga feses menjadi cair. Ini analisis hubungan organ–fungsi–gejala."
  },
  /* ---------- SOAL 10 ---------- */
  {
    type:"mc",
    hots:"C5 — Evaluasi",
    story:"Rani menemukan dua minuman: (A) air putih dan (B) minuman bersoda dingin. Ia ingin tahu mana yang lebih baik untuk pencernaan.",
    q:"Berdasarkan prinsip kerja enzim, evaluasilah pernyataan yang paling tepat!",
    options:[
      "Minuman bersoda lebih baik karena gas membantu pencernaan",
      "Air putih lebih baik karena enzim bekerja optimal pada suhu tubuh (~37°C) dan pH sesuai; suhu dingin dapat menurunkan aktivitas enzim",
      "Keduanya sama saja karena enzim tidak terpengaruh suhu",
      "Minuman dingin mempercepat kerja enzim",
      "Air putih menghambat kerja enzim"
    ],
    answer:1,
    pembahasan:"Enzim bekerja optimal pada suhu tubuh dan pH tertentu. Suhu rendah menurunkan aktivitas enzim (denaturasi tidak, tetapi kinetika melambat). Ini evaluasi penerapan sifat enzim."
  },
  /* ---------- SOAL 11 ---------- */
  {
    type:"mc",
    hots:"C4 — Analisis (dengan gambar)",
    story:"Rani melihat diagram kerja enzim. Ia belajar bahwa enzim memiliki sisi aktif yang spesifik.",
    q:"Perhatikan gambar model 'lock and key' berikut. Pernyataan yang PALING tepat menjelaskan gambar tersebut adalah …",
    img:"lock_key",
    options:[
      "Enzim dapat bekerja pada semua substrat",
      "Enzim bersifat spesifik: hanya substrat dengan bentuk komplementer yang dapat berikatan dengan sisi aktif",
      "Enzim dihabiskan dalam reaksi",
      "Enzim mengubah bentuk substrat secara permanen tanpa hasil",
      "Enzim bekerja tanpa dipengaruhi pH"
    ],
    answer:1,
    pembahasan:"Model lock and key menjelaskan spesifisitas enzim: sisi aktif enzim hanya cocok dengan substrat tertentu. Enzim tidak habis bereaksi dan dapat digunakan berulang."
  },
  /* ---------- SOAL 12 ---------- */
  {

/* =========================================================
   INTERAKSI
   ========================================================= */
function selectMC(i){
  answers[current] = i;
  document.querySelectorAll(".option").forEach((el,idx)=>{
    el.classList.toggle("selected", idx===i);
  });
}

function nextQ(){
  const q = QUESTIONS[current];
  // validasi
  if(q.type === "mc" && answers[current] === null){
    alert("Silakan pilih salah satu jawaban terlebih dahulu."); return;
  }
  if(q.type === "essay" && (!answers[current] || answers[current].trim().length < 20)){
    alert("Tuliskan jawabanmu minimal 20 karakter."); return;
  }
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    showResult();
  }
}

function prevQ(){
  if(current > 0){ current--; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
}

function updateProgress(){
  const pct = Math.round((current)/QUESTIONS.length*100);
  document.getElementById("progText").textContent = `Soal ${current+1} dari ${QUESTIONS.length}`;
  document.getElementById("progPersen").textContent = pct + "%";
  document.getElementById("progFill").style.width = pct + "%";
}

/* =========================================================
   CANVAS DRAWING
   ========================================================= */
let ctx, drawing=false, lastX=0, lastY=0;
function initCanvas(){
  const cv = document.getElementById("drawCanvas");
  ctx = cv.getContext("2d");
  ctx.fillStyle = "#fffef9"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap="round"; ctx.lineJoin="round";

  // restore gambar sebelumnya
  if(canvasData[current]){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0);
    img.src = canvasData[current];
  }

  const getPos = (e)=>{
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:(t.clientX-r.left)*(cv.width/r.width), y:(t.clientY-r.top)*(cv.height/r.height)};
  };

  const start = (e)=>{ e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; };
  const move = (e)=>{
    if(!drawing) return; e.preventDefault();
    const p=getPos(e);
    ctx.strokeStyle = document.getElementById("colorPick").value;
    ctx.lineWidth = document.getElementById("brushSize").value;
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y;
  };
  const end = ()=>{ 
    if(drawing){ drawing=false; canvasData[current]=cv.toDataURL(); }
  };

  cv.addEventListener("mousedown",start); cv.addEventListener("mousemove",move);
  cv.addEventListener("mouseup",end); cv.addEventListener("mouseleave",end);
  cv.addEventListener("touchstart",start,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end);
}
function clearCanvas(){
  const cv = document.getElementById("drawCanvas");
  ctx.fillStyle="#fffef9"; ctx.fillRect(0,0,cv.width,cv.height);
  canvasData[current]=null;
}
function downloadCanvas(){
  const cv = document.getElementById("drawCanvas");
  const a = document.createElement("a");
  a.download = `gambar_soal${current+1}_${studentName}.png`;
  a.href = cv.toDataURL(); a.click();
}

/* =========================================================
   HASIL & UNDUH LAPORAN
   ========================================================= */
function showResult(){
  progWrap.style.display = "none";
  // hitung skor MC (essay & gambar dinilai manual / dianggap terisi)
  let mcTotal = 0, mcCorrect = 0;
  QUESTIONS.forEach((q,i)=>{
    if(q.type === "mc"){
      mcTotal++;
      if(answers[i] === q.answer) mcCorrect++;
    }
  });
  const scoreMC = Math.round(mcCorrect/mcTotal*100);
  const essayFilled = QUESTIONS.filter((q,i)=> (q.type==="essay"||q.type==="draw") && (answers[i]||canvasData[i])).length;
  const totalAspect = mcTotal + 2; // 2 soal non-MC
  const finalScore = Math.round((mcCorrect + essayFilled)/totalAspect*100);

  let predikat, warna;
  if(finalScore >= 85){ predikat="Sangat Baik 🌅"; warna="#1e8449"; }
  else if(finalScore >= 70){ predikat="Baik 🌇"; warna="#e67e22"; }
  else if(finalScore >= 55){ predikat="Cukup 🌆"; warna="#c0392b"; }
  else { predikat="Perlu Belajar Lagi 📚"; warna="#7a2e2e"; }

  // review
  let reviewHTML = QUESTIONS.map((q,i)=>{
    if(q.type === "mc"){
      const ok = answers[i]===q.answer;
      return `<div class="review-item">
        <b>Soal ${i+1}</b> (${q.hots}) — <span class="${ok?'correct':'wrong'}">${ok?'✔ Benar':'✘ Salah'}</span><br>
        Jawabanmu: ${answers[i]!==null?LETTERS[answers[i]]+'. '+q.options[answers[i]]:'—'}<br>
        Kunci: ${LETTERS[q.answer]}. ${q.options[q.answer]}
        <div class="pembahasan">💡 ${q.pembahasan}</div>
      </div>`;
    } else if(q.type === "essay"){
      return `<div class="review-item">
        <b>Soal ${i+1}</b> (${q.hots}) — <span class="correct">📝 Esai</span><br>
        Jawabanmu: ${answers[i]? answers[i].substring(0,120)+'...' : '—'}
        <div class="pembahasan">💡 ${q.pembahasan}</div>
      </div>`;
    } else {
      return `<div class="review-item">
        <b>Soal ${i+1}</b> (${q.hots}) — <span class="correct">🎨 Gambar</span><br>
        ${canvasData[i]? '<img src="'+canvasData[i]+'" style="max-width:200px;border-radius:8px;margin-top:6px;border:2px solid #e67e22;"/>' : 'Belum menggambar'}
        <div class="pembahasan">💡 ${q.pembahasan}</div>
      </div>`;
    }
  }).join("");

  app.innerHTML = `
    <div class="card active result">
      <div class="score-circle" style="--deg:${finalScore*3.6}deg">
        <span class="score-val">${finalScore}</span>
      </div>
      <h2>Hasil Asesmen</h2>
      <div class="predikat" style="background:${warna};">${predikat}</div>
      <p><b>${studentName}</b> — Skor Pilihan Ganda: ${scoreMC}% (${mcCorrect}/${mcTotal})</p>
      <p style="font-size:.9rem;color:#7a2e2e;margin-top:6px;">Soal esai & gambar dinilai oleh guru berdasarkan rubrik.</p>
      
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;">
        <button class="btn btn-primary" onclick="downloadReport()">⬇️ Unduh Laporan (HTML)</button>
        <button class="btn btn-secondary" onclick="downloadJSON()">⬇️ Unduh Data (JSON)</button>
        <button class="btn btn-secondary" onclick="restart()">🔄 Ulangi</button>
      </div>

      <div class="review">
        <h3 style="color:#7a2e2e;margin-bottom:10px;">📋 Ulasan & Pembahasan</h3>
        ${reviewHTML}
      </div>
    </div>
  `;
  window.scrollTo({top:0,behavior:"smooth"});
}

    <p><b>Tanggal:</b> ${new Date().toLocaleString('id-ID')}</p>

    <p><b>Soal Esai & Gambar:</b> Terlampir (dinilai guru)</p>
  </div>
  <h2>Rincian Jawaban</h2>
  <table>
    <tr><th>No</th><th>Aspek HOTS</th><th>Pertanyaan</th><th>Jawaban Siswa</th><th>Status</th><th>Pembahasan</th></tr>
    ${rows}
  </table>
  <h2>Lampiran Gambar</h2>
  ${imgSection || '<p><i>Tidak ada gambar.</i></p>'}
  <div class="footer">DigestiQuest © ${new Date().getFullYear()} — Asesmen HOTS Sistem Pencernaan Manusia<br>Dibuat oleh Web Designer & Guru Biologi Kelas XI</div>
  </body></html>`;
}

function downloadReport(){
  const html = buildReportHTML();
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Laporan_DigestiQuest_${studentName.replace(/\s+/g,'_')}.html`;
  a.click();
}

function downloadJSON(){
  const data = {
    nama: studentName,
    tanggal: new Date().toISOString(),
    jawaban: QUESTIONS.map((q,i)=>({
      no: i+1,
      tipe: q.type,
      hots: q.hots,
      pertanyaan: q.q.replace(/<[^>]*>/g,''),
      jawaban: q.type==="draw" ? (canvasData[i]?"[gambar]":null) : answers[i],
      kunci: q.type==="mc" ? LETTERS[q.answer]+'. '+q.options[q.answer] : null,
      benar: q.type==="mc" ? answers[i]===q.answer : null
    }))
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Data_DigestiQuest_${studentName.replace(/\s+/g,'_')}.json`;
  a.click();
}

function restart(){
  if(confirm("Yakin ingin mengulang? Semua jawaban akan dihapus.")) renderIntro();
}

/* =========================================================
   INIT
   ========================================================= */
renderIntro();
</script>
